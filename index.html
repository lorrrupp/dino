  [_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,T,T,T,T,T,T,_,_,_,_,_,_,_],
  [_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,T,T,T,_,_,_,_,_,_],
];
const NECK_BODY=[
  [_,_,_,_,_,_,_,_,_,_,_,_,T,L,_,_,_,_,_,_,T,T,_,_,_,_,_,_],
  [_,_,_,_,_,_,_,_,_,_,L,L,T,T,T,T,_,_,_,_,T,T,_,_,_,_,_,_],
  [_,T,_,_,_,_,_,_,_,T,T,L,T,L,L,T,L,_,_,_,T,T,_,_,_,_,_,_],
  [T,T,_,_,_,_,_,_,L,T,T,T,T,L,L,T,T,T,_,_,T,T,_,_,_,_,_,_],
  [T,T,_,_,_,_,_,T,T,T,T,L,T,T,T,T,L,T,_,_,T,T,_,_,_,_,_,_],
  [T,T,_,_,_,_,T,T,T,L,T,T,T,L,T,T,T,T,T,T,T,T,_,_,_,_,_,_],
  [T,T,T,_,_,_,T,T,T,T,T,T,T,T,T,T,T,T,T,T,T,T,_,_,_,_,_,_],
  [_,T,T,T,T,T,T,T,T,T,T,T,T,T,T,T,T,T,T,T,T,T,_,_,_,_,_,_],
  [_,_,T,T,T,T,T,T,T,T,T,T,T,T,T,T,T,T,T,T,T,_,_,_,_,_,_,_],
  [_,_,_,_,_,T,T,T,T,T,T,T,T,T,T,T,T,T,T,T,T,_,_,_,_,_,_,_],
];

// NECK_BODY_BACK: NECK_BODY + neck-curve pixels at col 22, rows 1-4 (right-facing).
const NECK_BODY_BACK=NECK_BODY.map((row,i)=>{
  const r=[...row];
  if(i===1||i===2||i===3||i===4) r[22]=T;
  return r;
});

// ── Down pose sprites (press ↓) ───────────────────────────────────────────────
// DOWN_HEAD: rows 0–5 (drawn at canvas rows 0–5, replaces normal head)
const DOWN_HEAD=[
  [_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,T,T,_,_],
  [_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,T,T,T,T,_],
  [_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,T,T,T,K,T,T],
  [_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,T,T,T,P,T,T,T],
  [_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,T,T,T,T,T,T,_],
  [_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,T,T,T,_,_,_,_,_],
];
// DOWN_NECK_BODY: rows 0–12 (drawn at canvas rows 6–18, neck bends + head tip at bottom)
const DOWN_NECK_BODY=[
  [_,_,_,_,_,_,_,_,_,_,_,_,T,L,_,_,_,_,_,_,_,_,_,_,_,_,_,_],
  [_,_,_,_,_,_,_,_,_,_,L,L,T,T,T,T,_,_,_,_,_,_,_,_,_,_,_,_],
  [_,T,_,_,_,_,_,_,_,T,T,L,T,L,L,T,L,_,_,_,_,_,_,_,_,_,_,_],
  [T,T,_,_,_,_,_,_,L,T,T,T,T,L,L,T,T,T,_,_,_,T,T,T,_,_,_,_],
  [T,T,_,_,_,_,_,T,T,T,T,L,T,T,T,T,L,T,_,_,T,T,T,T,T,_,_,_],
  [T,T,_,_,_,_,T,T,T,L,T,T,T,L,T,T,T,T,T,T,T,T,T,T,T,_,_,_],
  [T,T,T,_,_,_,T,T,T,T,T,T,T,T,T,T,T,T,T,T,T,T,_,T,T,_,_,_],
  [_,T,T,T,T,T,T,T,T,T,T,T,T,T,T,T,T,T,T,T,T,T,_,T,T,T,_,_],
  [_,_,T,T,T,T,T,T,T,T,T,T,T,T,T,T,T,T,T,T,T,_,_,T,T,T,T,_],
  [_,_,_,_,_,T,T,T,T,T,T,T,T,T,T,T,T,T,T,T,T,_,_,T,P,T,T,T],
  [_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,T,T,K,T,T],
  [_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,T,T,T,T,_],
  [_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,T,T,_,_],
];
// Down pose canvas height: 6 (head) + 13 (neck/body extended) = 19 rows = same px as normal
// but the last 3 rows of DOWN_NECK_BODY extend below the normal feet line

function flipRow(r){return[...r].reverse();}
function flipGrid(g){return g.map(r=>flipRow(r));}
const HEAD_FWD_L      =flipGrid(HEAD_FWD);
const HEAD_BACK_L     =flipGrid(HEAD_BACK);
const NECK_BODY_L     =flipGrid(NECK_BODY);
const NECK_BODY_BACK_L=flipGrid(NECK_BODY_BACK);
const DOWN_HEAD_L     =flipGrid(DOWN_HEAD);
const DOWN_NECK_BODY_L=flipGrid(DOWN_NECK_BODY);

function makeLegs(pairs){
  const r1=new Array(W).fill(_),r2=new Array(W).fill(_),r3=new Array(W).fill(_);
  pairs.forEach(([a,b])=>{r1[a]=T;r1[b]=T;r2[a]=T;r2[b]=T;r3[a]=L;r3[b]=L;});
  return[r1,r2,r3];
}
const LA =makeLegs([[5,6],[9,10],[14,15],[18,19]]);
const LB =makeLegs([[6,7],[9,10],[14,15],[19,20]]);
const LC =makeLegs([[5,6],[10,11],[15,16],[18,19]]);
function mirrorPairs(p){return p.map(([a,b])=>[W-1-b,W-1-a]).sort((x,y)=>x[0]-y[0]);}
const LA_L=makeLegs(mirrorPairs([[5,6],[9,10],[14,15],[18,19]]));
const LB_L=makeLegs(mirrorPairs([[6,7],[9,10],[14,15],[19,20]]));
const LC_L=makeLegs(mirrorPairs([[5,6],[10,11],[15,16],[18,19]]));
const WALK_R=[LA,LB,LA,LC], WALK_L=[LA_L,LB_L,LA_L,LC_L];

// ── Heart ────────────────────────────────────────────────────────────────────
const HEART=[[_,H,_,H,_],[H,H,H,H,H],[_,H,H,H,_],[_,_,H,_,_]];
const HPX=7;
const HEART_W=5*HPX, HEART_H=4*HPX;
const hearts=[];
const HEART_RISE=0.45;
const FADE_ZONE=80;

function spawnHeart(){
  const R=facing==='right';
  const ox = R ? 25*PX - Math.floor(HEART_W/2) : 2*PX - Math.floor(HEART_W/2);
  const sceneH=scene.offsetHeight;
  const oy = sceneH - SPRITE_H - HEART_H - 8 - 2*PX;
  hearts.push({ox, oy, age:0, opacity:0.4+Math.random()*0.6});
  playSparkle();
}

// ── State ────────────────────────────────────────────────────────────────────
const HEAD_COL_R=24*PX, HEAD_COL_L=3*PX;
function headWorldX(px,f){return f==='right'?px+HEAD_COL_R:px+HEAD_COL_L;}
function posXFromHead(hx,f){return f==='right'?hx-HEAD_COL_R:hx-HEAD_COL_L;}

const GRAVITY=0.3, JUMP_VEL=-7, SPEED=2;
let posX=60, posY=0, velY=0, onGround=true;
let facing='right', moveDir=0;
let eating=false;
let walkFrame=0, walkTimer=0;
const WALK_DUR=28;
let blinkTimer=130+Math.random()*80, blinking=false, blinkCount=0;
const BLINK_DUR=22;

// Direction-change glance
const GLANCE_LOOK=32, GLANCE_STEP=14;
let glancing=false, glanceTimer=0, glancePhase='', pendingDir=0;

// Idle alternating behaviour
// Fires every 180–360 frames when dino is standing still
// Alternates: look-back (90 frames) → heart → look-back → heart ...
let idleTimer=200+Math.floor(Math.random()*160); // first trigger
let idleNext='back';    // 'back' or 'heart'
let idleLooking=false;  // currently holding idle back-head pose
let idleLookTimer=0;
const IDLE_LOOK_DUR=90; // frames to hold the back-head in idle

let sceneW=scene.offsetWidth;
let hasInteracted=false;
function onFirstInteract(){
  if(hasInteracted)return;
  hasInteracted=true;
  const el=document.getElementById('clickme');
  if(el) el.style.display='none';
}

function resizeHC(){
  hcv.width=scene.offsetWidth;
  hcv.height=scene.offsetHeight;
}
resizeHC();
window.addEventListener('resize',()=>{ sceneW=scene.offsetWidth; resizeHC(); });

function jump(){if(onGround){velY=JUMP_VEL;onGround=false;playJump();}}

// ── Draw ─────────────────────────────────────────────────────────────────────
function drawRow(row,canvasRow,eyeCol){
  for(let c=0;c<row.length;c++){
    let col=row[c]; if(!col)continue;
    if(blinking&&c===eyeCol&&col===K) col=T;
    ctx.fillStyle=col;
    ctx.fillRect(c*PX, canvasRow*PX, PX, PX);
  }
}

function drawDino(){
  const R=facing==='right';
  const atWall=(moveDir!==0)&&((posX<=0&&moveDir<0)||(posX>=(sceneW-SPRITE_W)&&moveDir>0));
  const showBack = glancePhase==='look' || atWall || idleLooking;

  cv.width=SPRITE_W; cv.height=SPRITE_H;
  ctx.clearRect(0,0,cv.width,cv.height);

  if(eating){
    // 1. Legs first (rows 16–18)
    const lf=(R?WALK_R:WALK_L)[walkFrame];
    for(let i=0;i<lf.length;i++) drawRow(lf[i],16+i,-1);
    // 2. Down neck+body — eye K is at DOWN_NECK_BODY row 10, col 25 (R) / col 2 (L)
    const dn = R ? DOWN_NECK_BODY : DOWN_NECK_BODY_L;
    const downEyeC = R ? 25 : W-1-25;
    for(let i=0;i<dn.length;i++) drawRow(dn[i],6+i, i===10 ? downEyeC : -1);
    // Rows 0–5 stay blank — normal head is gone
  } else {
    // Normal pose
    const nb=showBack?(R?NECK_BODY_BACK:NECK_BODY_BACK_L):(R?NECK_BODY:NECK_BODY_L);
    const head=showBack?(R?HEAD_BACK:HEAD_BACK_L):(R?HEAD_FWD:HEAD_FWD_L);
    const eyeC=showBack?(R?16:W-1-16):(R?25:W-1-25);
    for(let i=0;i<head.length;i++) drawRow(head[i],i,i===2?eyeC:-1);
    for(let i=0;i<nb.length;i++) drawRow(nb[i],6+i,-1);
    const lf=(R?WALK_R:WALK_L)[walkFrame];
    for(let i=0;i<lf.length;i++) drawRow(lf[i],16+i,-1);
  }

  cv.style.left  =Math.round(posX)+'px';
  cv.style.bottom=Math.round(posY)+'px';
}

function drawHearts(){
  hctx.clearRect(0,0,hcv.width,hcv.height);
  for(const ht of hearts){
    const wx = posX + ht.ox;
    const wy = ht.oy - ht.age * HEART_RISE;
    const heartTop = wy;
    const posAlpha = heartTop<=0 ? 0 : heartTop<FADE_ZONE ? heartTop/FADE_ZONE : 1;
    const birthAlpha = ht.age<8 ? ht.age/8 : 1;
    const alpha = Math.min(posAlpha, birthAlpha) * ht.opacity;
    if(alpha<=0) continue;
    hctx.globalAlpha=alpha;
    for(let r=0;r<HEART.length;r++){
      for(let c=0;c<HEART[r].length;c++){
        if(!HEART[r][c]) continue;
        hctx.fillStyle=H;
        hctx.fillRect(Math.round(wx+c*HPX), Math.round(wy+r*HPX), HPX, HPX);
      }
    }
  }
  hctx.globalAlpha=1;
}

// ── Update ────────────────────────────────────────────────────────────────────
function update(){
  const maxX=sceneW-SPRITE_W;

  // Direction-change glance
  if(glancing){
    glanceTimer--;
    if(glancePhase==='look'&&glanceTimer<=0){
      const hx=headWorldX(posX,facing);
      facing=pendingDir>0?'right':'left';
      posX=Math.max(0,Math.min(maxX,posXFromHead(hx,facing)));
      glancePhase='step'; glanceTimer=GLANCE_STEP;
    } else if(glancePhase==='step'&&glanceTimer<=0){
      glancing=false; glancePhase='';
    }
  }

  // Movement
  if(moveDir!==0){
    const wantRight=moveDir>0, facingRight=facing==='right';
    if(wantRight!==facingRight&&!glancing){
      glancing=true; glancePhase='look'; glanceTimer=GLANCE_LOOK; pendingDir=moveDir;
    } else if(!glancing){
      const nx=posX+moveDir*SPEED;
      posX=nx<=0?0:nx>=maxX?maxX:nx;
    } else if(glancePhase==='step'){
      const nx=posX+pendingDir*SPEED;
      posX=nx<=0?0:nx>=maxX?maxX:nx;
    }
  }

  // Physics
  if(!onGround){ velY+=GRAVITY; posY-=velY; if(posY<=0){posY=0;velY=0;onGround=true;} }

  // Walk cycle
  walkTimer++; if(walkTimer>=WALK_DUR){walkTimer=0;walkFrame=(walkFrame+1)%4;}

  // Blink
  blinkTimer--; if(blinkTimer<=0&&!blinking){blinking=true;blinkCount=0;blinkTimer=130+Math.random()*80;}
  if(blinking){blinkCount++;if(blinkCount>BLINK_DUR)blinking=false;}

  // Idle alternating behaviour
  const isIdle = moveDir===0 && onGround && !glancing;
  if(isIdle){
    if(idleLooking){
      // count down the hold duration then return to forward
      idleLookTimer--;
      if(idleLookTimer<=0) idleLooking=false;
    } else {
      idleTimer--;
      if(idleTimer<=0){
        if(idleNext==='back'){
          idleLooking=true;
          idleLookTimer=IDLE_LOOK_DUR;
          idleNext='heart';
        } else {
          spawnHeart();
          idleNext='back';
        }
        // randomise next interval 180–360 frames (~3–6 s at 60 fps)
        idleTimer=180+Math.floor(Math.random()*180);
      }
    }
  } else {
    // interrupted by movement — reset so it doesn't fire immediately on next stop
    if(moveDir!==0){
      idleTimer=180+Math.floor(Math.random()*180);
      idleLooking=false;
    }
  }

  // Age & cull hearts
  for(let i=hearts.length-1;i>=0;i--){
    hearts[i].age++;
    if(hearts[i].oy - hearts[i].age*HEART_RISE + HEART_H < 0) hearts.splice(i,1);
  }
}

function loop(){
  update();
  drawDino();
  drawHearts();
  // Keep CLICK ME centred above the hump (body peak ≈ col 13, canvas row 6 from top of sprite)
  if(!hasInteracted){
    const lbl=document.getElementById('clickme');
    if(lbl){
      // Hump col ≈ 10 right-facing, mirrored to col 17 left-facing
      const humpCol = facing==='right' ? 13 : 14;
      const humpX = posX + humpCol*PX;
      const sceneH = scene.offsetHeight;
      const spriteTop = sceneH - SPRITE_H - Math.round(posY);
      lbl.style.left = Math.round(humpX)+'px';
      lbl.style.top  = Math.round(spriteTop - 22)+'px';
    }
  }
  requestAnimationFrame(loop);
}
loop();

// ── Input ─────────────────────────────────────────────────────────────────────
scene.addEventListener('click',()=>{onFirstInteract();spawnHeart();});
scene.addEventListener('touchstart',e=>{e.preventDefault();onFirstInteract();spawnHeart();},{passive:false});

const keys={};
document.addEventListener('keydown',e=>{
  onFirstInteract();
  if(e.key==='ArrowLeft' ||e.key==='a'){e.preventDefault();moveDir=-1;keys.left=true;startWalkSound();}
  if(e.key==='ArrowRight'||e.key==='d'){e.preventDefault();moveDir=1; keys.right=true;startWalkSound();}
  if(e.key==='ArrowUp'||e.key==='w'||e.code==='Space'){e.preventDefault();jump();}
  if(e.key==='ArrowDown'||e.key==='s'){e.preventDefault();if(!eating){eating=true;startEatSound();}}
});
document.addEventListener('keyup',e=>{
  if(e.key==='ArrowLeft' ||e.key==='a') keys.left=false;
  if(e.key==='ArrowRight'||e.key==='d') keys.right=false;
  if(!keys.left&&!keys.right){moveDir=0;stopWalkSound();}
  else if(keys.left &&!keys.right) moveDir=-1;
  else if(keys.right&&!keys.left)  moveDir=1;
  if(e.key==='ArrowDown'||e.key==='s'){eating=false;stopEatSound();}
});
</script>
</body>
