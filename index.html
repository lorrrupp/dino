<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brachio</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;overflow:hidden;}
  #scene{
    width:100%;
    height:266px;
    position:relative;
    overflow:hidden;
    cursor:pointer;
  }
  #c{
    image-rendering:pixelated;
    image-rendering:crisp-edges;
    position:absolute;
    bottom:0;
  }
  #hc{
    position:absolute;
    top:0;left:0;
    width:100%;
    height:100%;
    pointer-events:none;
  }
</style>
</head>
<body>
<div id="scene">
  <canvas id="c" width="196" height="133"></canvas>
  <canvas id="hc"></canvas>
</div>
<script>
const cv   = document.getElementById('c');
const ctx  = cv.getContext('2d');
const hcv  = document.getElementById('hc');
const hctx = hcv.getContext('2d');
const scene = document.getElementById('scene');

// PX=7: dino is 28col*7=196px wide, 19row*7=133px tall (~150px target)
const PX=7, W=28, SPRITE_W=196, SPRITE_H=133;
const T='#B4D9DF',L='#D9FAFF',K='#000000',P='#F8B9C2',H='#FF5971',_=null;

// ── Sprite data ──────────────────────────────────────────────────────────────
const HEAD_FWD=[
  [_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,T,T,_,_],
  [_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,T,T,T,T,_],
  [_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,T,T,T,K,T,T],
  [_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,T,T,T,P,T,T,T],
  [_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,T,T,T,T,T,T,_],
  [_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,T,T,T,_,_,_,_,_],
];
const HEAD_BACK=[
  [_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,T,T,_,_,_,_,_,_,_,_,_,_],
  [_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,T,T,T,T,_,_,_,_,_,_,_,_,_],
  [_,_,_,_,_,_,_,_,_,_,_,_,_,_,T,T,K,T,T,T,_,_,_,_,_,_,_,_],
  [_,_,_,_,_,_,_,_,_,_,_,_,_,_,T,T,T,P,T,T,T,_,_,_,_,_,_,_],
  [_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,T,T,T,T,T,T,_,_,_,_,_,_,_],
  [_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,T,T,T,_,_,_,_,_,_],
];
const NECK_BODY=[
  [_,_,_,_,_,_,_,_,_,_,_,_,T,L,_,_,_,_,_,_,T,T,_,_,_,_,_,_],
  [_,_,_,_,_,_,_,_,_,_,L,L,T,T,T,T,_,_,_,_,T,T,_,_,_,_,_,_],
  [_,T,_,_,_,_,_,_,_,T,T,L,T,L,L,T,L,_,_,_,T,T,_,_,_,_,_,_],
  [T,T,_,_,_,_,_,_,L,T,T,T,T,L,L,T,T,T,_,_,T,T,_,_,_,_,_,_],
  [T,T,_,_,_,_,_,T,T,T,T,L,T,T,T,T,L,T,_,_,T,T,_,_,_,_,_,_],
  [T,T,_,_,_,_,T,T,T,L,T,T,T,L,T,T,T,T,T,T,T,T,_,_,_,_,_,_],
  [T,T,T,_,_,_,T,T,T,T,T,T,T,T,T,T,T,T,T,T,T,T,_,_,_,_,_,_],
  [_,T,T,T,T,T,T,T,T,T,T,T,T,T,T,T,T,T,T,T,T,T,_,_,_,_,_,_],
  [_,_,T,T,T,T,T,T,T,T,T,T,T,T,T,T,T,T,T,T,T,_,_,_,_,_,_,_],
  [_,_,_,_,_,T,T,T,T,T,T,T,T,T,T,T,T,T,T,T,T,_,_,_,_,_,_,_],
];

function flipRow(r){return[...r].reverse();}
function flipGrid(g){return g.map(r=>flipRow(r));}
const HEAD_FWD_L =flipGrid(HEAD_FWD);
const HEAD_BACK_L=flipGrid(HEAD_BACK);
const NECK_BODY_L=flipGrid(NECK_BODY);

function makeLegs(pairs){
  const r1=new Array(W).fill(_),r2=new Array(W).fill(_),r3=new Array(W).fill(_);
  pairs.forEach(([a,b])=>{r1[a]=T;r1[b]=T;r2[a]=T;r2[b]=T;r3[a]=L;r3[b]=L;});
  return[r1,r2,r3];
}
const LA =makeLegs([[5,6],[9,10],[14,15],[18,19]]);
const LB =makeLegs([[6,7],[9,10],[14,15],[19,20]]);
const LC =makeLegs([[5,6],[10,11],[15,16],[18,19]]);
function mirrorPairs(p){return p.map(([a,b])=>[W-1-b,W-1-a]).sort((x,y)=>x[0]-y[0]);}
const LA_L=makeLegs(mirrorPairs([[5,6],[9,10],[14,15],[18,19]]));
const LB_L=makeLegs(mirrorPairs([[6,7],[9,10],[14,15],[19,20]]));
const LC_L=makeLegs(mirrorPairs([[5,6],[10,11],[15,16],[18,19]]));
const WALK_R=[LA,LB,LA,LC], WALK_L=[LA_L,LB_L,LA_L,LC_L];

// ── Heart ────────────────────────────────────────────────────────────────────
const HEART=[[_,H,_,H,_],[H,H,H,H,H],[_,H,H,H,_],[_,_,H,_,_]];
const HPX=4;
const HEART_W=5*HPX, HEART_H=4*HPX;
const hearts=[];
const HEART_RISE=0.45; // px per frame rising
const HEART_MAX_AGE=600; // generous max; alpha kills it before this

// Fade zone: heart fully transparent within this many px of the container top
const FADE_ZONE=100;

function spawnHeart(){
  const R=facing==='right';
  const ox = R ? 24*PX - Math.floor(HEART_W/2) : 3*PX - Math.floor(HEART_W/2);
  // spawn just above the dino's head tip (head occupies top ~5 rows = 70px of sprite)
  const sceneH=scene.offsetHeight;
  const oy = sceneH - SPRITE_H - HEART_H - 8;
  hearts.push({ox, oy, age:0});
}

// ── State ────────────────────────────────────────────────────────────────────
const HEAD_COL_R=24*PX, HEAD_COL_L=3*PX;
function headWorldX(px,f){return f==='right'?px+HEAD_COL_R:px+HEAD_COL_L;}
function posXFromHead(hx,f){return f==='right'?hx-HEAD_COL_R:hx-HEAD_COL_L;}

const GRAVITY=0.3, JUMP_VEL=-7, SPEED=2;
let posX=60, posY=0, velY=0, onGround=true;
let facing='right', moveDir=0;
let walkFrame=0, walkTimer=0;
const WALK_DUR=28;
let blinkTimer=130+Math.random()*80, blinking=false, blinkCount=0;
const BLINK_DUR=22;
const GLANCE_LOOK=32, GLANCE_STEP=14;
let glancing=false, glanceTimer=0, glancePhase='', pendingDir=0;

let sceneW=scene.offsetWidth;

function resizeHC(){
  hcv.width=scene.offsetWidth;
  hcv.height=scene.offsetHeight;
}
resizeHC();
window.addEventListener('resize',()=>{ sceneW=scene.offsetWidth; resizeHC(); });

function jump(){if(onGround){velY=JUMP_VEL;onGround=false;}}

// ── Draw dino ────────────────────────────────────────────────────────────────
function drawRow(row,canvasRow,eyeCol){
  for(let c=0;c<row.length;c++){
    let col=row[c]; if(!col)continue;
    if(blinking&&c===eyeCol&&col===K) col=T;
    ctx.fillStyle=col;
    ctx.fillRect(c*PX, canvasRow*PX, PX, PX);
  }
}

function drawDino(){
  ctx.clearRect(0,0,cv.width,cv.height);
  const R=facing==='right';
  const nb=R?NECK_BODY:NECK_BODY_L;
  const atWall=(moveDir!==0)&&((posX<=0&&moveDir<0)||(posX>=(sceneW-SPRITE_W)&&moveDir>0));
  const showBack=glancePhase==='look'||atWall;
  const head=showBack?(R?HEAD_BACK:HEAD_BACK_L):(R?HEAD_FWD:HEAD_FWD_L);
  const eyeC=showBack?(R?16:W-1-16):(R?25:W-1-25);
  for(let i=0;i<head.length;i++) drawRow(head[i],i,i===2?eyeC:-1);
  for(let i=0;i<nb.length;i++) drawRow(nb[i],6+i,-1);
  const lf=(R?WALK_R:WALK_L)[walkFrame];
  for(let i=0;i<lf.length;i++) drawRow(lf[i],16+i,-1);
  cv.style.left  =Math.round(posX)+'px';
  cv.style.bottom=Math.round(posY)+'px';
}

// ── Draw hearts ──────────────────────────────────────────────────────────────
function drawHearts(){
  hctx.clearRect(0,0,hcv.width,hcv.height);
  for(const ht of hearts){
    const wx = posX + ht.ox;
    const wy = ht.oy - ht.age * HEART_RISE;

    // Fade based on position: 0 at container top (wy=0), full at FADE_ZONE below top
    // heartTop is the y of the top edge of the heart
    const heartTop = wy;
    const posAlpha = heartTop <= 0
      ? 0
      : heartTop < FADE_ZONE
        ? heartTop / FADE_ZONE
        : 1;

    // Gentle fade-in over first 8 frames
    const birthAlpha = ht.age < 8 ? ht.age / 8 : 1;

    const alpha = Math.min(posAlpha, birthAlpha);
    if(alpha <= 0) continue;

    hctx.globalAlpha = alpha;
    for(let r=0;r<HEART.length;r++){
      for(let c=0;c<HEART[r].length;c++){
        if(!HEART[r][c]) continue;
        hctx.fillStyle=H;
        hctx.fillRect(Math.round(wx+c*HPX), Math.round(wy+r*HPX), HPX, HPX);
      }
    }
  }
  hctx.globalAlpha=1;
}

// ── Update ────────────────────────────────────────────────────────────────────
function update(){
  const maxX=sceneW-SPRITE_W;

  if(glancing){
    glanceTimer--;
    if(glancePhase==='look'&&glanceTimer<=0){
      const hx=headWorldX(posX,facing);
      facing=pendingDir>0?'right':'left';
      posX=Math.max(0,Math.min(maxX,posXFromHead(hx,facing)));
      glancePhase='step'; glanceTimer=GLANCE_STEP;
    } else if(glancePhase==='step'&&glanceTimer<=0){
      glancing=false; glancePhase='';
    }
  }

  if(moveDir!==0){
    const wantRight=moveDir>0, facingRight=facing==='right';
    if(wantRight!==facingRight&&!glancing){
      glancing=true; glancePhase='look'; glanceTimer=GLANCE_LOOK; pendingDir=moveDir;
    } else if(!glancing){
      const nx=posX+moveDir*SPEED;
      posX=nx<=0?0:nx>=maxX?maxX:nx;
    } else if(glancePhase==='step'){
      const nx=posX+pendingDir*SPEED;
      posX=nx<=0?0:nx>=maxX?maxX:nx;
    }
  }

  if(!onGround){ velY+=GRAVITY; posY-=velY; if(posY<=0){posY=0;velY=0;onGround=true;} }

  walkTimer++; if(walkTimer>=WALK_DUR){walkTimer=0;walkFrame=(walkFrame+1)%4;}
  blinkTimer--; if(blinkTimer<=0&&!blinking){blinking=true;blinkCount=0;blinkTimer=130+Math.random()*80;}
  if(blinking){blinkCount++;if(blinkCount>BLINK_DUR)blinking=false;}

  // Remove hearts that have fully cleared the top
  for(let i=hearts.length-1;i>=0;i--){
    hearts[i].age++;
    if(hearts[i].oy - hearts[i].age*HEART_RISE + HEART_H < 0) hearts.splice(i,1);
  }
}

function loop(){ update(); drawDino(); drawHearts(); requestAnimationFrame(loop); }
loop();

// ── Input ─────────────────────────────────────────────────────────────────────
scene.addEventListener('click',()=>spawnHeart());
scene.addEventListener('touchstart',e=>{e.preventDefault();spawnHeart();},{passive:false});

const keys={};
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft' ||e.key==='a'){e.preventDefault();moveDir=-1;keys.left=true;}
  if(e.key==='ArrowRight'||e.key==='d'){e.preventDefault();moveDir=1; keys.right=true;}
  if(e.key==='ArrowUp'||e.key==='w'||e.code==='Space'){e.preventDefault();jump();}
});
document.addEventListener('keyup',e=>{
  if(e.key==='ArrowLeft' ||e.key==='a') keys.left=false;
  if(e.key==='ArrowRight'||e.key==='d') keys.right=false;
  if(!keys.left&&!keys.right) moveDir=0;
  else if(keys.left &&!keys.right) moveDir=-1;
  else if(keys.right&&!keys.left)  moveDir=1;
});
</script>
</body>
</html>
